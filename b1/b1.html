<!DOCTYPE html>
<html lang="vn">
<head>
    <meta charset="utf-8">
    <title>Bảng Điểm Sinh Viên</title>
    <link rel="stylesheet" href="b1.css">
</head>
<body>
    <h1>Bảng Điểm Sinh Viên</h1>
    <div class="controls">
        <label for="fullname">Họ và tên:</label>
        <input type="text" id="fullname" placeholder="Nhập họ và tên">
        
        <label for="score">Điểm (0-10):</label>
        <input type="number" id="score" min="0" max="10" step="0.1" placeholder="Nhập điểm">
        
        <button id="addBtn">Thêm</button>

        
    <input type="text" id="searchInput" placeholder="Tìm tên sinh viên...">
    <select id="filterGrade">
        <option value="Tất cả">Tất cả xếp loại</option>
        <option value="Giỏi">Giỏi</option>
        <option value="Khá">Khá</option>
        <option value="Trung bình">Trung bình</option>
        <option value="Yếu">Yếu</option>
    </select>
    </div>

    <th id="sortScore" style="cursor:pointer">Điểm <span id="sortIcon">↕</span></th>
    </div>
    
    <table id="studentTable">
        <thead>
            <tr>
                <th>STT</th>
                <th>Họ tên</th>
                <th>Điểm</th>
                <th>Xếp loại</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="studentBody">
        </tbody>
    </table>
    
    <div class="stats" id="stats">
        Tổng số sinh viên: 0 | Điểm trung bình: 0.00
    </div>
<script src="b1.js"></script>
</body>
</html>
